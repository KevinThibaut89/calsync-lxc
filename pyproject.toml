[project]
name = "calsync"
version = "0.1.0"
description = "One-way sync from an Outlook/Microsoft 365 calendar to Google Calendar, server-side."
requires-python = ">=3.11"
dependencies = []  # standard library only

[project.scripts]
calsync = "calsync.__main__:main"

[tool.setuptools]
packages = ["calsync"]

[tool.setuptools.package-data]
calsync = ["static/*"]
